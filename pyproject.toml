[project]
name = "grokking-ridge-repro"
version = "0.1.0"
description = "CPU reproduction of provable grokking in ridge regression (arXiv:2601.19791)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "matplotlib>=3.8,<4.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["repro/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repro"]
